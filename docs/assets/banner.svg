<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="KarmaLMS">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c6f5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#0b0c10"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- faint background motif -->
  <g opacity="0.06" stroke="#a78bfa" stroke-width="9" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M880 330 L980 230 L1060 290 L1160 150"/>
  </g>

  <!-- logomark -->
  <g transform="translate(404 116)">
    <rect width="84" height="84" rx="21" fill="url(#mark)"/>
    <path d="M22 58 L37 42 L49 51 L63 28" fill="none" stroke="#fff" stroke-width="5.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="58" r="6" fill="#fff"/>
    <circle cx="37" cy="42" r="6" fill="#fff"/>
    <circle cx="49" cy="51" r="6" fill="#fff"/>
    <circle cx="63" cy="28" r="7.4" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="178" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="800" letter-spacing="-2" fill="url(#word)">KarmaLMS</text>

  <!-- tagline -->
  <text x="600" y="262" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="24" fill="#9ca0ad">The open-source LMS built for corporate training</text>

  <!-- badge row -->
  <text x="600" y="312" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="15" letter-spacing="1.5" font-weight="600" fill="#6f7280">AWS-NATIVE&#160;&#160;&#183;&#160;&#160;AI-NATIVE&#160;&#160;&#183;&#160;&#160;SELF-HOSTED&#160;&#160;&#183;&#160;&#160;MIT LICENSED</text>
</svg>
